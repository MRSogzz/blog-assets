<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">三種多模態模型架構</title>
  <desc id="desc">對比式、融合式與統一式多模態架構的概念比較。</desc>
  <rect width="1200" height="300" rx="28" fill="#F7F3EA"/>
  <g font-family="Noto Sans, Noto Sans CJK TC, Arial, sans-serif" fill="#302F2C">
    <text x="600" y="42" text-anchor="middle" font-size="25" font-weight="700">三種多模態模型架構</text>
    <text x="600" y="68" text-anchor="middle" font-size="13" fill="#77736B">不同的設計目標：對齊、理解、以及更深度的跨模態整合</text>

    <g stroke="#8B877E" stroke-width="2">
      <rect x="50" y="100" width="320" height="145" rx="20" fill="#FFFDF8"/>
      <rect x="440" y="100" width="320" height="145" rx="20" fill="#FFFDF8"/>
      <rect x="830" y="100" width="320" height="145" rx="20" fill="#FFFDF8"/>
    </g>

    <g text-anchor="middle">
      <text x="210" y="132" font-size="20" font-weight="700">對比式</text>
      <text x="210" y="155" font-size="13" fill="#77736B">Contrastive</text>
      <text x="210" y="184" font-size="14">圖像編碼器 ↔ 文字編碼器</text>
      <text x="210" y="207" font-size="14">→ 共同嵌入空間</text>
      <text x="210" y="229" font-size="12" fill="#77736B">代表：CLIP / SigLIP</text>

      <text x="600" y="132" font-size="20" font-weight="700">融合式</text>
      <text x="600" y="155" font-size="13" fill="#77736B">Fusion</text>
      <text x="600" y="184" font-size="14">視覺表示 → Connector → LLM</text>
      <text x="600" y="207" font-size="14">→ 跨模態理解與文字生成</text>
      <text x="600" y="229" font-size="12" fill="#77736B">代表：LLaVA / BLIP-2 / Flamingo</text>

      <text x="990" y="132" font-size="20" font-weight="700">統一式</text>
      <text x="990" y="155" font-size="13" fill="#77736B">Unified / Native</text>
      <text x="990" y="184" font-size="14">多種模態 → 統一模型</text>
      <text x="990" y="207" font-size="14">→ 理解 + 生成 + 跨模態互動</text>
      <text x="990" y="229" font-size="12" fill="#77736B">代表：GPT-4o（端到端）</text>
    </g>

    <g stroke="#B0AAA0" stroke-width="2" fill="none">
      <path d="M370 172 H430"/>
      <path d="M760 172 H820"/>
    </g>
    <g fill="#B0AAA0">
      <path d="M430 172 l-10 -6 v12 z"/>
      <path d="M820 172 l-10 -6 v12 z"/>
    </g>
  </g>
</svg>
