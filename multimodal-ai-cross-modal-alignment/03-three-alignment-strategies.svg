<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><style>.h{font:600 30px sans-serif;fill:#37352f}.sh{font:600 23px sans-serif;fill:#37352f}.s{font:19px sans-serif;fill:#5f5a52}.t{font:16px sans-serif;fill:#756d62}.p{stroke:#d9cdbb;stroke-width:2}</style></defs><rect width="1200" height="760" rx="28" fill="#f7f2e9"/><text x="600" y="60" text-anchor="middle" class="h">三種常見對齊路線：目標、橋接與融合</text><text x="600" y="95" text-anchor="middle" class="t">它們處理不同層面，不是完全等價的方法</text>
<g transform="translate(55 145)"><rect width="340" height="520" rx="22" fill="#fffdf8" class="p"/><rect width="340" height="76" rx="22" fill="#e3ecdf"/><text x="170" y="47" text-anchor="middle" class="sh">1. 對比學習</text><text x="25" y="120" class="t">代表：CLIP、SigLIP</text><rect x="35" y="155" width="120" height="70" rx="12" fill="#f0e4d3" stroke="#d9cdbb"/><text x="95" y="196" text-anchor="middle" class="s">圖片向量</text><rect x="185" y="155" width="120" height="70" rx="12" fill="#e8e3ef" stroke="#c8bbdb"/><text x="245" y="196" text-anchor="middle" class="s">文字向量</text><path d="M155 190H185" stroke="#8b8175" stroke-width="3"/><text x="25" y="275" class="s">核心問題</text><text x="25" y="308" class="t">哪段文字最符合這張圖？</text><text x="25" y="365" class="s">主要作用</text><text x="25" y="398" class="t">學習跨模態相似度與檢索</text><text x="25" y="455" class="s">限制</text><text x="25" y="488" class="t">對齊本身不等於生成答案</text></g>
<g transform="translate(430 145)"><rect width="340" height="520" rx="22" fill="#fffdf8" class="p"/><rect width="340" height="76" rx="22" fill="#e8e3ef"/><text x="170" y="47" text-anchor="middle" class="sh">2. 投影層橋接</text><text x="25" y="120" class="t">代表：LLaVA 類架構</text><rect x="25" y="155" width="110" height="70" rx="12" fill="#f0e4d3" stroke="#d9cdbb"/><text x="80" y="196" text-anchor="middle" class="s">視覺特徵</text><path d="M135 190H160M230 190H255" stroke="#8b8175" stroke-width="3"/><rect x="160" y="155" width="70" height="70" rx="12" fill="#e8e3ef" stroke="#c8bbdb"/><text x="195" y="196" text-anchor="middle" class="s">MLP</text><rect x="255" y="155" width="60" height="70" rx="12" fill="#e3ecdf" stroke="#c7d7c3"/><text x="285" y="196" text-anchor="middle" class="t">LLM</text><text x="25" y="275" class="s">核心問題</text><text x="25" y="308" class="t">如何把視覺特徵轉成 LLM 可用表示？</text><text x="25" y="365" class="s">主要作用</text><text x="25" y="398" class="t">建立視覺表示與語言模型的介面</text><text x="25" y="455" class="s">限制</text><text x="25" y="488" class="t">投影不保證真正理解視覺細節</text></g>
<g transform="translate(805 145)"><rect width="340" height="520" rx="22" fill="#fffdf8" class="p"/><rect width="340" height="76" rx="22" fill="#f3e5ce"/><text x="170" y="47" text-anchor="middle" class="sh">3. 交叉注意力</text><text x="25" y="120" class="t">代表：Flamingo 類架構</text><rect x="25" y="155" width="120" height="70" rx="12" fill="#f0e4d3" stroke="#d9cdbb"/><text x="85" y="196" text-anchor="middle" class="s">視覺特徵</text><rect x="195" y="155" width="120" height="70" rx="12" fill="#e8e3ef" stroke="#c8bbdb"/><text x="255" y="196" text-anchor="middle" class="s">文字狀態</text><path d="M145 180Q170 145 195 180M145 202Q170 240 195 202" fill="none" stroke="#8b8175" stroke-width="3"/><text x="25" y="275" class="s">核心問題</text><text x="25" y="308" class="t">生成時如何讀取視覺資訊？</text><text x="25" y="365" class="s">主要作用</text><text x="25" y="398" class="t">讓語言模型動態查詢視覺特徵</text><text x="25" y="455" class="s">限制</text><text x="25" y="488" class="t">增加計算與架構設計複雜度</text></g><text x="600" y="710" text-anchor="middle" class="t">實際模型可組合多條路線：先訓練投影介面，再用指令資料調整生成行為</text></svg>