<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><style>.h{font:600 29px sans-serif;fill:#37352f}.sh{font:600 22px sans-serif;fill:#37352f}.s{font:18px sans-serif;fill:#5f5a52}.t{font:16px sans-serif;fill:#756d62}.p{fill:#fffdf8;stroke:#d9cdbb;stroke-width:2}</style></defs><rect width="1200" height="700" rx="28" fill="#f7f2e9"/><text x="600" y="58" text-anchor="middle" class="h">對齊幾何與常見失敗模式</text>
<g transform="translate(55 110)"><rect width="520" height="500" rx="22" class="p"/><text x="260" y="45" text-anchor="middle" class="sh">共同表示空間（概念示意）</text><path d="M60 410H460M80 430V90" fill="none" stroke="#c9bdad" stroke-width="2"/><circle cx="170" cy="190" r="13" fill="#7f9f87"/><circle cx="195" cy="210" r="10" fill="#a8c0ab"/><circle cx="145" cy="220" r="9" fill="#c0d2c1"/><circle cx="230" cy="170" r="8" fill="#7f9f87"/><text x="180" y="260" text-anchor="middle" class="s">圖片表示</text><circle cx="270" cy="205" r="13" fill="#bd936c"/><circle cx="295" cy="225" r="10" fill="#d7b99a"/><circle cx="250" cy="235" r="9" fill="#e4cfb8"/><circle cx="315" cy="185" r="8" fill="#bd936c"/><text x="290" y="275" text-anchor="middle" class="s">文字表示</text><path d="M210 205Q230 180 250 205" fill="none" stroke="#8b8175" stroke-width="2" stroke-dasharray="6 6"/><text x="260" y="465" text-anchor="middle" class="t">語意相符的圖文表示更容易互相匹配</text></g>
<g transform="translate(625 110)"><rect width="520" height="145" rx="20" class="p"/><circle cx="55" cy="52" r="21" fill="#e8e3ef"/><path d="M45 52H65M55 42V62" stroke="#8b8175" stroke-width="3"/><text x="95" y="48" class="sh">模態差距（Modality Gap）</text><text x="95" y="82" class="s">圖像與文字表示即使可匹配，</text><text x="95" y="108" class="s">分布仍可能保有系統性差異。</text>
<rect y="170" width="520" height="145" rx="20" class="p"/><circle cx="55" cy="222" r="21" fill="#f3e5ce"/><path d="M43 222H67" stroke="#8b8175" stroke-width="3"/><text x="95" y="218" class="sh">過度壓縮（Over-compression）</text><text x="95" y="252" class="s">表示被擠進過窄的子空間，</text><text x="95" y="278" class="s">可能犧牲細節與區分能力。</text>
<rect y="340" width="520" height="145" rx="20" class="p"/><circle cx="55" cy="392" r="21" fill="#e3ecdf"/><path d="M43 392H67M55 380V404" stroke="#8b8175" stroke-width="3"/><text x="95" y="388" class="sh">對齊不足（Under-alignment）</text><text x="95" y="422" class="s">語意相符的圖文仍難以匹配，</text><text x="95" y="448" class="s">檢索或下游推理可能受影響。</text></g>
<text x="600" y="650" text-anchor="middle" class="t">概念圖並非論文實驗結果；幾何指標可協助診斷，但不能單獨證明模型是否理解或產生幻覺</text></svg>