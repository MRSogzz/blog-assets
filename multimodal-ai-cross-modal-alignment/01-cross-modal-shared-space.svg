<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<defs><style>.h{font:600 30px sans-serif;fill:#37352f}.s{font:20px sans-serif;fill:#5f5a52}.t{font:16px sans-serif;fill:#756d62}.p{fill:#fffdf8;stroke:#d9cdbb;stroke-width:2}</style><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#8b8175"/></marker></defs>
<rect width="1200" height="680" rx="28" fill="#f7f2e9"/><text x="600" y="62" text-anchor="middle" class="h">跨模態對齊：不同輸入，共同語意結構</text>
<rect x="65" y="130" width="300" height="180" rx="20" class="p"/><rect x="835" y="130" width="300" height="180" rx="20" class="p"/>
<rect x="95" y="155" width="240" height="105" rx="12" fill="#e8eee3"/><circle cx="290" cy="180" r="15" fill="#e9c77e"/><path d="M95 250L160 195L205 230L255 200L335 258Z" fill="#a9bca4"/><path d="M95 260Q160 240 220 260T335 258V260Z" fill="#7f9b83"/><text x="215" y="292" text-anchor="middle" class="h">圖片</text>
<text x="985" y="180" text-anchor="middle" class="h">文字</text><rect x="870" y="200" width="230" height="50" rx="12" fill="#f3e5ce" stroke="#e1cba8"/><text x="985" y="231" text-anchor="middle" class="s">「一隻狗在草地上」</text>
<path d="M365 220H460M835 220H740" stroke="#8b8175" stroke-width="3" marker-end="url(#a)"/>
<rect x="460" y="130" width="280" height="180" rx="20" fill="#e8e3ef" stroke="#c8bbdb" stroke-width="2"/><text x="600" y="170" text-anchor="middle" class="h">編碼器</text><rect x="490" y="190" width="220" height="42" rx="10" class="p"/><text x="600" y="217" text-anchor="middle" class="s">視覺向量</text><rect x="490" y="245" width="220" height="42" rx="10" class="p"/><text x="600" y="272" text-anchor="middle" class="s">文字向量</text>
<path d="M600 310V375" stroke="#8b8175" stroke-width="3" marker-end="url(#a)"/><rect x="250" y="380" width="700" height="220" rx="24" fill="#fbf8f1" stroke="#cbbda8" stroke-width="2"/><text x="600" y="423" text-anchor="middle" class="h">共同語意空間</text><text x="600" y="453" text-anchor="middle" class="t">相似概念靠近；不相關概念保持距離</text>
<circle cx="425" cy="510" r="16" fill="#789b86"/><circle cx="450" cy="490" r="11" fill="#a5b9a7"/><circle cx="468" cy="520" r="9" fill="#c1d0c0"/><text x="440" y="560" text-anchor="middle" class="s">狗的圖片</text>
<circle cx="730" cy="510" r="16" fill="#b38d6c"/><circle cx="753" cy="490" r="11" fill="#d3b89a"/><circle cx="775" cy="520" r="9" fill="#e0cbb2"/><text x="750" y="560" text-anchor="middle" class="s">狗的描述</text><path d="M485 510Q600 470 675 510" fill="none" stroke="#8b8175" stroke-width="2" stroke-dasharray="7 7"/>
<text x="600" y="642" text-anchor="middle" class="t">目標是讓語意相符的表示更容易互相匹配，而非讓兩種表示完全相同</text></svg>