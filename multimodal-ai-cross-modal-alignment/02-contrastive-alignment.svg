<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>.h{font:600 30px sans-serif;fill:#37352f}.s{font:20px sans-serif;fill:#5f5a52}.t{font:17px sans-serif;fill:#5f5a52}.c{stroke:#fffdf8;stroke-width:4}</style></defs><rect width="1200" height="720" rx="28" fill="#f7f2e9"/><text x="600" y="60" text-anchor="middle" class="h">對比學習：正配對更接近，錯配對更容易區分</text><text x="350" y="125" text-anchor="middle" class="s">文字表示 →</text><text x="95" y="360" text-anchor="middle" class="s" transform="rotate(-90 95 360)">圖片表示 →</text>
<g transform="translate(190 165)"><g class="t" text-anchor="middle"><text x="50" y="-18">狗</text><text x="160" y="-18">汽車</text><text x="270" y="-18">海灘</text><text x="380" y="-18">貓</text></g><g class="t" text-anchor="end"><text x="-25" y="55">狗圖</text><text x="-25" y="165">車圖</text><text x="-25" y="275">海灘圖</text><text x="-25" y="385">貓圖</text></g>
<g fill="#72977e"><rect width="100" height="100" rx="10" class="c"/><rect x="110" y="110" width="100" height="100" rx="10" class="c"/><rect x="220" y="220" width="100" height="100" rx="10" class="c"/><rect x="330" y="330" width="100" height="100" rx="10" class="c"/></g><g fill="#e6d9c8"><rect x="110" width="100" height="100" rx="10" class="c"/><rect x="220" width="100" height="100" rx="10" class="c"/><rect x="330" width="100" height="100" rx="10" class="c"/><rect y="110" width="100" height="100" rx="10" class="c"/><rect x="220" y="110" width="100" height="100" rx="10" class="c"/><rect x="330" y="110" width="100" height="100" rx="10" class="c"/><rect width="100" height="100" y="220" rx="10" class="c"/><rect x="110" y="220" width="100" height="100" rx="10" class="c"/><rect x="330" y="220" width="100" height="100" rx="10" class="c"/><rect width="100" height="100" y="330" rx="10" class="c"/><rect x="110" y="330" width="100" height="100" rx="10" class="c"/><rect x="220" y="330" width="100" height="100" rx="10" class="c"/></g><g fill="#fffdf8" font-family="sans-serif" font-size="28" font-weight="600" text-anchor="middle"><text x="50" y="62">+</text><text x="160" y="172">+</text><text x="270" y="282">+</text><text x="380" y="392">+</text></g></g>
<rect x="720" y="180" width="390" height="130" rx="18" fill="#fffdf8" stroke="#d9cdbb" stroke-width="2"/><circle cx="760" cy="220" r="9" fill="#72977e"/><text x="785" y="227" class="s">對角線：正配對</text><circle cx="760" cy="267" r="9" fill="#e6d9c8" stroke="#cdbca7"/><text x="785" y="274" class="s">非對角線：批次內負配對</text>
<text x="720" y="365" class="h" font-size="23">訓練流程</text><text x="720" y="405" class="s">1. 計算圖片與文字的相似度</text><text x="720" y="445" class="s">2. 提高正配對的相對分數</text><text x="720" y="485" class="s">3. 區分不匹配的配對</text><rect x="720" y="530" width="390" height="100" rx="16" fill="#e8e3ef" stroke="#c8bbdb" stroke-width="2"/><text x="915" y="565" text-anchor="middle" class="s">CLIP 使用雙向對比目標</text><text x="915" y="595" text-anchor="middle" class="t">圖片→文字 + 文字→圖片</text><text x="600" y="675" text-anchor="middle" class="t">概念示意；實際損失還包含相似度 logits 與溫度係數</text></svg>