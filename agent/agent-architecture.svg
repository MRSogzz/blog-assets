<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" preserveAspectRatio="xMidYMid meet">
<title>LLM Agent system architecture</title>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".10"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#39434E"/>
  </marker>
  <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5E7184"/>
  </marker>
</defs>
<rect x="24" y="24" width="952" height="512" rx="22" fill="#FBFAF7" stroke="#D8D3C9" stroke-width="1.2"/><text x="500" y="62" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="23px" font-weight="700" fill="#26313B">Agent 系統架構</text><text x="500" y="88" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="13px" font-weight="450" fill="#687179">LLM 是決策核心；Planning、Memory、Tools 與 Guardrails 共同形成可執行系統</text><rect x="90" y="118" width="820" height="360" rx="34" fill="none" stroke="#AEB9BE" stroke-width="2" stroke-dasharray="9 8"/><text x="500" y="145" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="12px" font-weight="650" fill="#657078">GUARDRAILS / 安全與控制邊界</text><circle cx="500" cy="295" r="82" fill="#E9EEF0" stroke="#9EABB1" stroke-width="2" filter="url(#shadow)"/><text x="500" y="290" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="25px" font-weight="750" fill="#26313B">LLM</text><text x="500" y="314" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="12px" font-weight="500" fill="#657078">Reasoning / Decision</text><rect x="240" y="205" width="180" height="62" rx="14" fill="#F5F2EC" stroke="#C9C5BC" stroke-width="1.5"/><text x="330.0" y="232" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="16px" font-weight="700" fill="#26313B">Planning</text><text x="330.0" y="253" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="11px" font-weight="450" fill="#687179">規劃</text><rect x="580" y="205" width="180" height="62" rx="14" fill="#F5F2EC" stroke="#C9C5BC" stroke-width="1.5"/><text x="670.0" y="232" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="16px" font-weight="700" fill="#26313B">Memory</text><text x="670.0" y="253" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="11px" font-weight="450" fill="#687179">記憶</text><rect x="205" y="380" width="180" height="62" rx="14" fill="#F5F2EC" stroke="#C9C5BC" stroke-width="1.5"/><text x="295.0" y="407" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="16px" font-weight="700" fill="#26313B">Tools</text><text x="295.0" y="428" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="11px" font-weight="450" fill="#687179">工具</text><rect x="615" y="380" width="180" height="62" rx="14" fill="#F5F2EC" stroke="#C9C5BC" stroke-width="1.5"/><text x="705.0" y="407" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="16px" font-weight="700" fill="#26313B">Environment</text><text x="705.0" y="428" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="11px" font-weight="450" fill="#687179">環境</text><line x1="420" y1="236" x2="430" y2="255" stroke="#39434E" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="580" y1="236" x2="570" y2="255" stroke="#39434E" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="385" y1="411" x2="430" y2="344" stroke="#39434E" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="615" y1="411" x2="570" y2="344" stroke="#39434E" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="615" y1="380" x2="575" y2="345" stroke="#5E7184" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowAccent)" stroke-dasharray="6 5"/><line x1="430" y1="345" x2="385" y2="380" stroke="#5E7184" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowAccent)" stroke-dasharray="6 5"/><rect x="415" y="160" width="170" height="46" rx="11" fill="#FFFFFF" stroke="#C5C9CA" stroke-width="1.5"/><text x="500" y="189" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="14px" font-weight="600" fill="#26313B">Goal / User Input</text><line x1="500" y1="206" x2="500" y2="212" stroke="#39434E" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="500" y="455" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="12px" font-weight="500" fill="#687179">Observation / Result 回饋決策</text><path d="M 160 170 C 130 240 130 390 165 445" fill="none" stroke="#AEB9BE" stroke-width="1.5" stroke-dasharray="5 6"/><path d="M 840 170 C 870 240 870 390 835 445" fill="none" stroke="#AEB9BE" stroke-width="1.5" stroke-dasharray="5 6"/><text x="125" y="490" text-anchor="start" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="11px" font-weight="500" fill="#687179">權限 / 驗證 / 限制</text><text x="875" y="490" text-anchor="end" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="11px" font-weight="500" fill="#687179">安全檢查 / 輸出控制</text></svg>