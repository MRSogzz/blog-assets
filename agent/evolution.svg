<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" preserveAspectRatio="xMidYMid meet">
<title>LLM Agent capability evolution</title>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".10"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#39434E"/>
  </marker>
  <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5E7184"/>
  </marker>
</defs>
<rect x="24" y="24" width="952" height="252" rx="22" fill="#FBFAF7" stroke="#D8D3C9" stroke-width="1.2"/><text x="56" y="62" text-anchor="start" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="22px" font-weight="700" fill="#26313B">從對話到行動：能力逐步增加</text><text x="56" y="88" text-anchor="start" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="13px" font-weight="400" fill="#6D747B">概念演進圖；不是嚴格的年代時間線</text><circle cx="75" cy="156" r="45" fill="#F2EEE7" stroke="#AEB5B9" stroke-width="1.5"/><text x="75" y="151" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="16px" font-weight="700" fill="#26313B">Chatbot</text><text x="75" y="172" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="11px" font-weight="450" fill="#667078">生成文字</text><line x1="123" y1="156" x2="227" y2="156" stroke="#5E7184" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowAccent)"/><circle cx="275" cy="156" r="45" fill="#EEF1F2" stroke="#AEB5B9" stroke-width="1.5"/><text x="275" y="151" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="16px" font-weight="700" fill="#26313B">Tool Use</text><text x="275" y="172" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="11px" font-weight="450" fill="#667078">連接外部工具</text><line x1="323" y1="156" x2="427" y2="156" stroke="#5E7184" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowAccent)"/><circle cx="475" cy="156" r="45" fill="#E9EFED" stroke="#AEB5B9" stroke-width="1.5"/><text x="475" y="151" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="16px" font-weight="700" fill="#26313B">Memory</text><text x="475" y="172" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="11px" font-weight="450" fill="#667078">保留上下文</text><line x1="523" y1="156" x2="627" y2="156" stroke="#5E7184" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowAccent)"/><circle cx="675" cy="156" r="45" fill="#E7EDF1" stroke="#AEB5B9" stroke-width="1.5"/><text x="675" y="151" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="16px" font-weight="700" fill="#26313B">Agent</text><text x="675" y="172" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="11px" font-weight="450" fill="#667078">目標導向循環</text><line x1="723" y1="156" x2="827" y2="156" stroke="#5E7184" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowAccent)"/><circle cx="875" cy="156" r="45" fill="#E8ECE8" stroke="#AEB5B9" stroke-width="1.5"/><text x="875" y="151" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="16px" font-weight="700" fill="#26313B">Autonomous</text><text x="875" y="172" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="11px" font-weight="450" fill="#667078">更高程度的自主執行</text><text x="500" y="225" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="14px" font-weight="500" fill="#4C5963">文字生成  →  工具調用  →  記憶  →  規劃 / 反思  →  更長鏈的自主任務</text></svg>