ns CJK JP, Inter, Arial, sans-serif" font-size="17px" font-weight="700" fill="#26313B">Act</text><text x="450" y="413" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="12px" font-weight="500" fill="#687179">行動</text><circle cx="275" cy="270" r="61" fill="#F0EBEF" stroke="#B8BEC0" stroke-width="1.5" filter="url(#shadow)"/><text x="275" y="266" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="17px" font-weight="700" fill="#26313B">Reflect</text><text x="275" y="288" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="12px" font-weight="500" fill="#687179">反思</text><path d="M 498 161 C 548 176 588 211 604 238" fill="none" stroke="#39434E" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M 604 302 C 588 342 548 374 498 389" fill="none" stroke="#39434E" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M 402 389 C 352 374 312 342 296 302" fill="none" stroke="#39434E" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M 296 238 C 312 211 352 176 402 161" fill="none" stroke="#39434E" stroke-width="2.2" marker-end="url(#arrow)"/><text x="98" y="152" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="13px" font-weight="650" fill="#687179">輸入</text><text x="98" y="175" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="12px" font-weight="450" fill="#687179">使用者指令</text><text x="98" y="194" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="12px" font-weight="450" fill="#687179">環境狀態</text><text x="98" y="213" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="12px" font-weight="450" fill="#687179">記憶資訊</text><line x1="145" y1="181" x2="210" y2="181" stroke="#5E7184" stroke-width="1.7" stroke-linecap="round" marker-end="url(#arrowAccent)" stroke-dasharray="5 5"/><text x="802" y="355" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="13px" font-weight="650" fill="#687179">輸出 / 結果</text><text x="802" y="378" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="12px" font-weight="450" fill="#687179">工具結果</text><text x="802" y="397" text-anchor="middle" font-family="Noto Sans, Noto Sans CJK JP, Inter, Arial, sans-serif" font-size="12px" font-weight="450" fill="#687179">環境變化</text><line x1="755" y1="372" x2="690" y2="372" stroke="#5E7184" stroke-width="1.7" stroke-linecap="round" marker-end="url(#arrowAccent)" stroke-dasharray="5 5"/></svg>