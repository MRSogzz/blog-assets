<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Multimodal AI overview</title>
  <desc id="desc">Text, image, audio, video and sensor data converge as multimodal information.</desc>
  <rect width="1200" height="260" rx="28" fill="#F7F3EA"/>
  <g font-family="Noto Sans, Arial, sans-serif" fill="#302F2C">
    <text x="600" y="42" text-anchor="middle" font-size="24" font-weight="700">Multimodal AI</text>
    <text x="600" y="68" text-anchor="middle" font-size="13" fill="#77736B">不同模態共同提供資訊，而不是彼此孤立</text>

    <g stroke="#8B877E" stroke-width="2" fill="#FFFDF8">
      <rect x="55" y="105" width="145" height="72" rx="16"/>
      <rect x="255" y="105" width="145" height="72" rx="16"/>
      <rect x="455" y="105" width="145" height="72" rx="16"/>
      <rect x="655" y="105" width="145" height="72" rx="16"/>
      <rect x="855" y="105" width="145" height="72" rx="16"/>
    </g>

    <g text-anchor="middle">
      <text x="127" y="134" font-size="17" font-weight="700">文字</text>
      <text x="127" y="157" font-size="12" fill="#77736B">Text</text>
      <text x="327" y="134" font-size="17" font-weight="700">圖像</text>
      <text x="327" y="157" font-size="12" fill="#77736B">Image</text>
      <text x="527" y="134" font-size="17" font-weight="700">音訊</text>
      <text x="527" y="157" font-size="12" fill="#77736B">Audio</text>
      <text x="727" y="134" font-size="17" font-weight="700">影片</text>
      <text x="727" y="157" font-size="12" fill="#77736B">Video</text>
      <text x="927" y="134" font-size="17" font-weight="700">感測器</text>
      <text x="927" y="157" font-size="12" fill="#77736B">Sensors</text>
    </g>

    <g stroke="#A6A096" stroke-width="2" fill="none">
      <path d="M127 177 C180 205, 430 215, 600 215"/>
      <path d="M327 177 C390 205, 500 215, 600 215"/>
      <path d="M527 177 C555 205, 580 215, 600 215"/>
      <path d="M727 177 C700 205, 660 215, 600 215"/>
      <path d="M927 177 C870 205, 770 215, 600 215"/>
    </g>
    <circle cx="600" cy="215" r="12" fill="#D8C7A8"/>
    <text x="600" y="247" text-anchor="middle" font-size="13" font-weight="600">跨模態理解與推理</text>
  </g>
</svg>
