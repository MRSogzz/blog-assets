<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Visual Token 的成本鏈</title><desc id="desc">圖片經視覺編碼後形成視覺 token，增加上下文長度、注意力運算與 KV Cache 需求，進而影響延遲與成本。</desc>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6F675C" flood-opacity=".10"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#746F65"/></marker>
<style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#37352F}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#746F65}.head{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#746F65}.panel{fill:#FFFCF7;stroke:#D8D0C4;stroke-width:1.5}.line{stroke:#746F65;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="720" rx="28" fill="#F7F2E9"/>
<text x="60" y="58" class="title" text-anchor="start">Visual Token 的成本鏈</text><text x="60" y="88" class="subtitle" text-anchor="start">從圖片輸入到推理成本：主要影響會沿著推理流程傳遞</text><rect x="45" y="185" width="200" height="155" rx="20" fill="#DFEAF0" stroke="#D8D0C4" stroke-width="1.5" filter="url(#shadow)"/><text x="145.0" y="228" class="head" text-anchor="middle">圖片輸入</text><text x="145.0" y="268" class="body" text-anchor="middle">解析度、切圖策略</text><text x="145.0" y="298" class="small" text-anchor="middle">決定視覺特徵規模</text><rect x="280" y="185" width="200" height="155" rx="20" fill="#E8E3EF" stroke="#D8D0C4" stroke-width="1.5" filter="url(#shadow)"/><text x="380.0" y="228" class="head" text-anchor="middle">視覺編碼器</text><text x="380.0" y="268" class="body" text-anchor="middle">Patch / 特徵提取</text><text x="380.0" y="298" class="small" text-anchor="middle">產生視覺 token</text><rect x="515" y="185" width="200" height="155" rx="20" fill="#DDE8D8" stroke="#D8D0C4" stroke-width="1.5" filter="url(#shadow)"/><text x="615.0" y="228" class="head" text-anchor="middle">Context Length</text><text x="615.0" y="268" class="body" text-anchor="middle">序列長度增加</text><text x="615.0" y="298" class="small" text-anchor="middle">影響 prefill 計算</text><rect x="750" y="185" width="200" height="155" rx="20" fill="#F3E0D1" stroke="#D8D0C4" stroke-width="1.5" filter="url(#shadow)"/><text x="850.0" y="228" class="head" text-anchor="middle">KV Cache</text><text x="850.0" y="268" class="body" text-anchor="middle">保存 Key / Value</text><text x="850.0" y="298" class="small" text-anchor="middle">隨 token 與批次增長</text><rect x="985" y="185" width="170" height="155" rx="20" fill="#DFEAF0" stroke="#D8D0C4" stroke-width="1.5" filter="url(#shadow)"/><text x="1070.0" y="228" class="head" text-anchor="middle">推理成本</text><text x="1070.0" y="268" class="body" text-anchor="middle">延遲、顯存</text><text x="1070.0" y="298" class="small" text-anchor="middle">吞吐與成本受影響</text><path d="M245 262 H272" class="line"/><path d="M480 262 H507" class="line"/><path d="M715 262 H742" class="line"/><path d="M950 262 H977" class="line"/><rect x="75" y="415" width="510" height="175" rx="18" fill="#FFFCF7" stroke="#D8D0C4" stroke-width="1.5"/><text x="330" y="454" class="head" text-anchor="middle">注意力計算</text><text x="330" y="491" class="body" text-anchor="middle">標準全注意力：注意力部分計算量隨序列長度二次方增長</text><text x="330" y="525" class="small" text-anchor="middle">序列長度翻倍，注意力矩陣面積約增為四倍</text><text x="330" y="555" class="small" text-anchor="middle">FlashAttention 降低額外記憶體需求，但不消除二次方計算</text><rect x="615" y="415" width="510" height="175" rx="18" fill="#FFFCF7" stroke="#D8D0C4" stroke-width="1.5"/><text x="870" y="454" class="head" text-anchor="middle">工程上的關鍵</text><text x="870" y="491" class="body" text-anchor="middle">token 數量不是唯一變數</text><text x="870" y="525" class="small" text-anchor="middle">編碼器、解析度、切圖、上下文與 batch size</text><text x="870" y="555" class="small" text-anchor="middle">共同決定實際成本與顯存壓力</text><text x="600" y="665" class="small" text-anchor="middle">概念示意｜實際成本依模型架構、輸入設定與 serving 實作而異</text></svg>
