<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Dynamic Resolution 動態分辨率</title><desc id="desc">根據問題與圖片內容選擇足夠的解析度，避免所有圖片都使用相同的高解析度配置。</desc>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6F675C" flood-opacity=".10"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#746F65"/></marker>
<style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#37352F}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#746F65}.head{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#746F65}.panel{fill:#FFFCF7;stroke:#D8D0C4;stroke-width:1.5}.line{stroke:#746F65;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="720" rx="28" fill="#F7F2E9"/>
<text x="60" y="58" class="title" text-anchor="start">Dynamic Resolution｜動態分辨率</text><text x="60" y="88" class="subtitle" text-anchor="start">讓輸入解析度跟著任務需求改變，而不是一律採用最高解析度</text><rect x="60" y="145" width="300" height="390" rx="22" fill="#FFFCF7" stroke="#D8D0C4" stroke-width="1.5" filter="url(#shadow)"/><text x="210" y="185" class="head" text-anchor="middle">同一張圖片</text><rect x="115" y="215" width="190" height="120" rx="12" fill="#DFEAF0" stroke="#D8D0C4"/><circle cx="258" cy="245" r="16" fill="#E7C98E"/><path d="M125 313 L175 265 L210 295 L245 260 L295 315 Z" fill="#6E8D73" opacity=".75"/><rect x="115" y="355" width="190" height="95" rx="10" fill="#F5F1E8" stroke="#D8D0C4"/><rect x="132" y="372" width="150" height="5" rx="2.5" fill="#746F65" opacity=".45"/><rect x="132" y="388" width="125" height="5" rx="2.5" fill="#746F65" opacity=".45"/><rect x="132" y="404" width="160" height="5" rx="2.5" fill="#746F65" opacity=".45"/><rect x="132" y="420" width="105" height="5" rx="2.5" fill="#746F65" opacity=".45"/><text x="210" y="488" class="small" text-anchor="middle">場景理解 / 讀取小字</text><path d="M360 340 H415 V245 H460" class="line"/><path d="M415 340 V460 H460" class="line"/><rect x="470" y="160" width="290" height="170" rx="20" fill="#DFEAF0" stroke="#D8D0C4" stroke-width="1.5" filter="url(#shadow)"/><text x="615" y="200" class="head" text-anchor="middle">低至中解析度</text><text x="615" y="240" class="body" text-anchor="middle">整體場景、物件類別</text><text x="615" y="273" class="small" text-anchor="middle">較少 token / 較低成本</text><rect x="470" y="385" width="290" height="170" rx="20" fill="#F3E0D1" stroke="#D8D0C4" stroke-width="1.5" filter="url(#shadow)"/><text x="615" y="425" class="head" text-anchor="middle">較高解析度</text><text x="615" y="465" class="body" text-anchor="middle">OCR、小字、細節辨識</text><text x="615" y="498" class="small" text-anchor="middle">更多 token / 較高成本</text><path d="M760 245 H815 V340 H850" class="line"/><path d="M760 470 H815 V380 H850" class="line"/><rect x="860" y="240" width="285" height="200" rx="22" fill="#DDE8D8" stroke="#D8D0C4" stroke-width="1.5" filter="url(#shadow)"/><text x="1002" y="280" class="head" text-anchor="middle">依問題選擇</text><text x="1002" y="320" class="body" text-anchor="middle">查詢 × 圖片內容</text><text x="1002" y="355" class="body" text-anchor="middle">分辨率選擇器</text><text x="1002" y="390" class="small" text-anchor="middle">輸出足夠的視覺表示</text><rect x="120" y="585" width="960" height="65" rx="16" fill="#FFFCF7" stroke="#D8D0C4" stroke-width="1.5"/><text x="600" y="613" class="body" text-anchor="middle">注意：動態分辨率不等於無損壓縮；選得太低仍可能遺失關鍵細節</text><text x="600" y="637" class="small" text-anchor="middle">實際策略可結合裁切、多尺度特徵、切圖與 token resampling</text></svg>
