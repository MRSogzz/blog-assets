<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Token Pruning 與 Token Merging</title><desc id="desc">Pruning 移除低貢獻 token；Merging 將相似 token 合併成代表性表示。兩者均需評估資訊損失與任務表現。</desc>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6F675C" flood-opacity=".10"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#746F65"/></marker>
<style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#37352F}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#746F65}.head{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#746F65}.panel{fill:#FFFCF7;stroke:#D8D0C4;stroke-width:1.5}.line{stroke:#746F65;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="720" rx="28" fill="#F7F2E9"/>
<text x="60" y="58" class="title" text-anchor="start">Token Pruning 與 Token Merging</text><text x="60" y="88" class="subtitle" text-anchor="start">兩種壓縮策略：移除不重要的表示，或合併相似的表示</text><rect x="55" y="130" width="525" height="455" rx="22" fill="#FFFCF7" stroke="#D8D0C4" stroke-width="1.5" filter="url(#shadow)"/><rect x="625" y="130" width="520" height="455" rx="22" fill="#FFFCF7" stroke="#D8D0C4" stroke-width="1.5" filter="url(#shadow)"/><text x="317" y="174" class="head" text-anchor="middle">A. Token Pruning｜修剪</text><text x="885" y="174" class="head" text-anchor="middle">B. Token Merging｜合併</text><text x="317" y="210" class="small" text-anchor="middle">輸入：一組視覺 token</text><rect x="180" y="226" width="38" height="38" rx="9" fill="#DFEAF0" stroke="#D8D0C4"/><circle cx="199.0" cy="245.0" r="5" fill="#66879A"/><rect x="228" y="226" width="38" height="38" rx="9" fill="#E8E3EF" stroke="#D8D0C4"/><circle cx="247.0" cy="245.0" r="5" fill="#83739A"/><rect x="276" y="226" width="38" height="38" rx="9" fill="#DDE8D8" stroke="#D8D0C4"/><circle cx="295.0" cy="245.0" r="5" fill="#6E8D73"/><rect x="324" y="226" width="38" height="38" rx="9" fill="#F3E0D1" stroke="#D8D0C4"/><circle cx="343.0" cy="245.0" r="5" fill="#B77C58"/><rect x="372" y="226" width="38" height="38" rx="9" fill="#DFEAF0" stroke="#D8D0C4"/><circle cx="391.0" cy="245.0" r="5" fill="#66879A"/><rect x="180" y="274" width="38" height="38" rx="9" fill="#E8E3EF" stroke="#D8D0C4"/><circle cx="199.0" cy="293.0" r="5" fill="#83739A"/><rect x="228" y="274" width="38" height="38" rx="9" fill="#DDE8D8" stroke="#D8D0C4"/><circle cx="247.0" cy="293.0" r="5" fill="#6E8D73"/><rect x="276" y="274" width="38" height="38" rx="9" fill="#F3E0D1" stroke="#D8D0C4"/><circle cx="295.0" cy="293.0" r="5" fill="#B77C58"/><rect x="324" y="274" width="38" height="38" rx="9" fill="#DFEAF0" stroke="#D8D0C4"/><circle cx="343.0" cy="293.0" r="5" fill="#66879A"/><rect x="372" y="274" width="38" height="38" rx="9" fill="#E8E3EF" stroke="#D8D0C4"/><circle cx="391.0" cy="293.0" r="5" fill="#83739A"/><path d="M317 320 V347" class="line"/><text x="317" y="380" class="body" text-anchor="middle">保留較有貢獻的 token</text><rect x="222" y="395" width="38" height="38" rx="9" fill="#DFEAF0" stroke="#D8D0C4"/><circle cx="241.0" cy="414.0" r="5" fill="#66879A"/><rect x="270" y="395" width="38" height="38" rx="9" fill="#E8E3EF" stroke="#D8D0C4"/><circle cx="289.0" cy="414.0" r="5" fill="#83739A"/><rect x="318" y="395" width="38" height="38" rx="9" fill="#DDE8D8" stroke="#D8D0C4"/><circle cx="337.0" cy="414.0" r="5" fill="#6E8D73"/><rect x="222" y="443" width="38" height="38" rx="9" fill="#F3E0D1" stroke="#D8D0C4"/><circle cx="241.0" cy="462.0" r="5" fill="#B77C58"/><rect x="270" y="443" width="38" height="38" rx="9" fill="#DFEAF0" stroke="#D8D0C4"/><circle cx="289.0" cy="462.0" r="5" fill="#66879A"/><rect x="318" y="443" width="38" height="38" rx="9" fill="#F2EDE5" stroke="#D8D0C4" stroke-dasharray="4 4"/><text x="337.0" y="467.0" class="body" text-anchor="middle">×</text><text x="317" y="520" class="small" text-anchor="middle">優點：序列更短，減少後續運算</text><text x="317" y="548" class="small" text-anchor="middle">風險：被移除區域可能含關鍵資訊</text><text x="885" y="210" class="small" text-anchor="middle">輸入：相似或重複的 token</text><rect x="748" y="226" width="38" height="38" rx="9" fill="#DFEAF0" stroke="#D8D0C4"/><circle cx="767.0" cy="245.0" r="5" fill="#66879A"/><rect x="796" y="226" width="38" height="38" rx="9" fill="#E8E3EF" stroke="#D8D0C4"/><circle cx="815.0" cy="245.0" r="5" fill="#83739A"/><rect x="844" y="226" width="38" height="38" rx="9" fill="#DDE8D8" stroke="#D8D0C4"/><circle cx="863.0" cy="245.0" r="5" fill="#6E8D73"/><rect x="892" y="226" width="38" height="38" rx="9" fill="#F3E0D1" stroke="#D8D0C4"/><circle cx="911.0" cy="245.0" r="5" fill="#B77C58"/><rect x="940" y="226" width="38" height="38" rx="9" fill="#DFEAF0" stroke="#D8D0C4"/><circle cx="959.0" cy="245.0" r="5" fill="#66879A"/><rect x="748" y="274" width="38" height="38" rx="9" fill="#E8E3EF" stroke="#D8D0C4"/><circle cx="767.0" cy="293.0" r="5" fill="#83739A"/><rect x="796" y="274" width="38" height="38" rx="9" fill="#DDE8D8" stroke="#D8D0C4"/><circle cx="815.0" cy="293.0" r="5" fill="#6E8D73"/><rect x="844" y="274" width="38" height="38" rx="9" fill="#F3E0D1" stroke="#D8D0C4"/><circle cx="863.0" cy="293.0" r="5" fill="#B77C58"/><rect x="892" y="274" width="38" height="38" rx="9" fill="#DFEAF0" stroke="#D8D0C4"/><circle cx="911.0" cy="293.0" r="5" fill="#66879A"/><rect x="940" y="274" width="38" height="38" rx="9" fill="#E8E3EF" stroke="#D8D0C4"/><circle cx="959.0" cy="293.0" r="5" fill="#83739A"/><path d="M885 320 V347" class="line"/><rect x="810" y="395" width="44" height="44" rx="10" fill="#DFEAF0" stroke="#D8D0C4"/><circle cx="832" cy="417" r="7" fill="#66879A"/><rect x="862" y="395" width="44" height="44" rx="10" fill="#DDE8D8" stroke="#D8D0C4"/><circle cx="884" cy="417" r="7" fill="#6E8D73"/><rect x="914" y="395" width="44" height="44" rx="10" fill="#E8E3EF" stroke="#D8D0C4"/><circle cx="936" cy="417" r="7" fill="#83739A"/><text x="885" y="470" class="body" text-anchor="middle">相似表示合併成代表 token</text><text x="885" y="520" class="small" text-anchor="middle">優點：保留部分共同特徵</text><text x="885" y="548" class="small" text-anchor="middle">風險：合併可能模糊細節差異</text><rect x="130" y="610" width="940" height="52" rx="16" fill="#DDE8D8" stroke="#DDE8D8" stroke-width="1.5"/><text x="600" y="642" class="body" text-anchor="middle">依任務、壓縮比例與精度損失評估；修剪與合併也可能搭配使用</text></svg>
