<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">多模態推理的多層優化</title><desc id="desc">多模態推理優化可分佈於輸入、視覺 token、KV Cache、注意力核心與 serving 層；各層可組合，但須驗證相容性與品質。</desc>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6F675C" flood-opacity=".10"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#746F65"/></marker>
<style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#37352F}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#746F65}.head{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#746F65}.panel{fill:#FFFCF7;stroke:#D8D0C4;stroke-width:1.5}.line{stroke:#746F65;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="720" rx="28" fill="#F7F2E9"/>
<text x="60" y="58" class="title" text-anchor="start">多模態推理的多層優化</text><text x="60" y="88" class="subtitle" text-anchor="start">不是固定流水線，而是依系統瓶頸組合的優化層</text><rect x="120" y="135" width="960" height="72" rx="16" fill="#DFEAF0" stroke="#D8D0C4" stroke-width="1.5"/><text x="148" y="164" class="head" text-anchor="start">01  輸入與視覺編碼</text><text x="470" y="164" class="body" text-anchor="start">動態分辨率、多尺度特徵、選擇性切圖</text><rect x="130" y="147" width="4" height="48" rx="2" fill="#746F65" opacity=".35"/><rect x="120" y="225" width="960" height="72" rx="16" fill="#E8E3EF" stroke="#D8D0C4" stroke-width="1.5"/><text x="148" y="254" class="head" text-anchor="start">02  Visual Token 表示</text><text x="470" y="254" class="body" text-anchor="start">Token Pruning、Token Merging、Resampling</text><rect x="130" y="237" width="4" height="48" rx="2" fill="#746F65" opacity=".35"/><rect x="120" y="315" width="960" height="72" rx="16" fill="#DDE8D8" stroke="#D8D0C4" stroke-width="1.5"/><text x="148" y="344" class="head" text-anchor="start">03  Attention 與 KV Cache</text><text x="470" y="344" class="body" text-anchor="start">FlashAttention、Cache 壓縮、Prefix Cache</text><rect x="130" y="327" width="4" height="48" rx="2" fill="#746F65" opacity=".35"/><rect x="120" y="405" width="960" height="72" rx="16" fill="#F3E0D1" stroke="#D8D0C4" stroke-width="1.5"/><text x="148" y="434" class="head" text-anchor="start">04  Serving 與排程</text><text x="470" y="434" class="body" text-anchor="start">批次策略、模態感知排程、並行與擴縮</text><rect x="130" y="417" width="4" height="48" rx="2" fill="#746F65" opacity=".35"/><rect x="120" y="495" width="960" height="72" rx="16" fill="#DFEAF0" stroke="#D8D0C4" stroke-width="1.5"/><text x="148" y="524" class="head" text-anchor="start">05  硬體與記憶體</text><text x="470" y="524" class="body" text-anchor="start">GPU 記憶體配置、頻寬利用、低精度運算</text><rect x="130" y="507" width="4" height="48" rx="2" fill="#746F65" opacity=".35"/><rect x="120" y="590" width="960" height="65" rx="16" fill="#FFFCF7" stroke="#D8D0C4" stroke-width="1.5"/><text x="600" y="618" class="body" text-anchor="middle">評估每一種組合：任務品質 × 延遲 × 吞吐 × 顯存 × 部署成本</text><text x="600" y="642" class="small" text-anchor="middle">相容性、資訊損失與實驗條件都必須明確驗證</text></svg>
