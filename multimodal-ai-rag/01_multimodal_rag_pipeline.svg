<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">多模態 RAG：從檢索到答案的流程</title><desc id="d">使用者問題進入多模態檢索，證據經融合整理後交給多模態大型語言模型生成答案。</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77746D"/></marker>
<style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#37352F}.eyebrow{font-size:15px;letter-spacing:2px;fill:#77746D}.heading{font-size:32px;font-weight:700}.sub{font-size:20px;font-weight:600}.body{font-size:17px}.small{font-size:14px;fill:#77746D}.arrow{stroke:#77746D;stroke-width:2;fill:none;marker-end:url(#arr)}</style></defs>
<rect width="1200" height="720" rx="26" fill="#F7F2E9"/><text x="64" y="58" class="eyebrow">MULTIMODAL RAG / 01</text><text x="64" y="108" class="heading">多模態 RAG：從檢索到答案</text><text x="64" y="145" class="body">不只找文字，也要找得到圖片、文件頁面、表格與影片片段。</text><rect x="55" y="205" width="190" height="210" rx="16" fill="#FCFAF6" stroke="#D8D0C4" stroke-width="1.5"/><circle cx="83" cy="235" r="15" fill="#64879A"/><text x="83" y="240" text-anchor="middle" style="font-size:12px;font-weight:700;fill:white">01</text><text x="75" y="281" class="sub">使用者問題</text><text x="75" y="323" class="body">自然語言查詢</text><text x="75" y="353" class="body">任務與限制</text><rect x="285" y="205" width="190" height="210" rx="16" fill="#DFEAF0" stroke="#D8D0C4" stroke-width="1.5"/><circle cx="313" cy="235" r="15" fill="#64879A"/><text x="313" y="240" text-anchor="middle" style="font-size:12px;font-weight:700;fill:white">02</text><text x="305" y="281" class="sub">多模態檢索</text><text x="305" y="323" class="body">文字／圖像索引</text><text x="305" y="353" class="body">頁面／表格／影片</text><rect x="515" y="205" width="190" height="210" rx="16" fill="#E8E3EF" stroke="#D8D0C4" stroke-width="1.5"/><circle cx="543" cy="235" r="15" fill="#83739A"/><text x="543" y="240" text-anchor="middle" style="font-size:12px;font-weight:700;fill:white">03</text><text x="535" y="281" class="sub">證據融合</text><text x="535" y="323" class="body">分數校準</text><text x="535" y="353" class="body">去重與對齊</text><rect x="745" y="205" width="190" height="210" rx="16" fill="#DDE8D8" stroke="#D8D0C4" stroke-width="1.5"/><circle cx="773" cy="235" r="15" fill="#6E8D73"/><text x="773" y="240" text-anchor="middle" style="font-size:12px;font-weight:700;fill:white">04</text><text x="765" y="281" class="sub">MLLM 生成</text><text x="765" y="323" class="body">整合相關證據</text><text x="765" y="353" class="body">依上下文回答</text><rect x="975" y="205" width="170" height="210" rx="16" fill="#F3E0D1" stroke="#D8D0C4" stroke-width="1.5"/><circle cx="1003" cy="235" r="15" fill="#B77C58"/><text x="1003" y="240" text-anchor="middle" style="font-size:12px;font-weight:700;fill:white">05</text><text x="995" y="281" class="sub">答案</text><text x="995" y="323" class="body">回應問題</text><text x="995" y="353" class="body">保留證據脈絡</text><line x1="245" y1="310" x2="280" y2="310" class="arrow"/><line x1="475" y1="310" x2="510" y2="310" class="arrow"/><line x1="705" y1="310" x2="740" y2="310" class="arrow"/><line x1="935" y1="310" x2="970" y2="310" class="arrow"/><rect x="90" y="475" width="1020" height="135" rx="16" fill="#FCFAF6" stroke="#D8D0C4" stroke-width="1.5"/><text x="120" y="515" class="sub">設計重點</text><text x="120" y="553" class="body">檢索結果不是直接拼接：先讓不同模態的證據可比較，再挑選精簡、互補且相關的上下文。</text><text x="120" y="584" class="small">評估可觀察 Recall@K、nDCG、答案正確性、延遲與成本。</text></svg>
