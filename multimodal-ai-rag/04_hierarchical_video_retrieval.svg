<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">影片的階層式多模態檢索</title><desc id="d">影片先切分為場景，再選出相關片段，最後擷取關鍵影格；同時保留時間順序與跨片段關係。</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77746D"/></marker>
<style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#37352F}.eyebrow{font-size:15px;letter-spacing:2px;fill:#77746D}.heading{font-size:32px;font-weight:700}.sub{font-size:20px;font-weight:600}.body{font-size:17px}.small{font-size:14px;fill:#77746D}.arrow{stroke:#77746D;stroke-width:2;fill:none;marker-end:url(#arr)}</style></defs>
<rect width="1200" height="720" rx="26" fill="#F7F2E9"/><text x="64" y="58" class="eyebrow">VIDEO RETRIEVAL / 04</text><text x="64" y="108" class="heading">影片檢索：先定位，再看細節</text><text x="64" y="145" class="body">階層式檢索可先縮小時間範圍，再取用足以回答問題的影格與片段。</text><text x="75" y="205" class="sub">整段影片</text><rect x="75" y="225" width="1050" height="52" rx="12" fill="#FCFAF6" stroke="#D8D0C4" stroke-width="1.5"/><rect x="88" y="234" width="235" height="34" rx="7" fill="#DFEAF0" stroke="#D8D0C4" stroke-width="1.5"/><text x="205.5" y="256" class="small" text-anchor="middle">場景 A</text><rect x="333" y="234" width="235" height="34" rx="7" fill="#DDE8D8" stroke="#D8D0C4" stroke-width="1.5"/><text x="450.5" y="256" class="small" text-anchor="middle">場景 B</text><rect x="578" y="234" width="235" height="34" rx="7" fill="#E8E3EF" stroke="#D8D0C4" stroke-width="1.5"/><text x="695.5" y="256" class="small" text-anchor="middle">場景 C</text><rect x="823" y="234" width="285" height="34" rx="7" fill="#F3E0D1" stroke="#D8D0C4" stroke-width="1.5"/><text x="965.5" y="256" class="small" text-anchor="middle">場景 D</text><text x="75" y="320" class="sub">1. 場景切分</text><text x="75" y="350" class="body">依時間、畫面變化或語意線索建立場景單位。</text><line x1="600" y1="280" x2="600" y2="382" class="arrow"/><rect x="75" y="385" width="1050" height="95" rx="16" fill="#E8E3EF" stroke="#83739A" stroke-width="1.5"/><text x="100" y="419" class="sub">2. 找出相關片段</text><text x="100" y="450" class="body">先用查詢定位可能相關的場景，再從場景內縮小到片段。</text><rect x="590" y="410" width="140" height="43" rx="9" fill="#DFEAF0" stroke="#D8D0C4" stroke-width="1.5"/><text x="660" y="437" class="small" text-anchor="middle">片段 1</text><rect x="755" y="410" width="140" height="43" rx="9" fill="#DDE8D8" stroke="#D8D0C4" stroke-width="1.5"/><text x="825" y="437" class="small" text-anchor="middle">片段 2</text><rect x="920" y="410" width="140" height="43" rx="9" fill="#F3E0D1" stroke="#D8D0C4" stroke-width="1.5"/><text x="990" y="437" class="small" text-anchor="middle">片段 3</text><line x1="600" y1="480" x2="600" y2="515" class="arrow"/><text x="75" y="535" class="sub">3. 擷取關鍵影格</text><rect x="75" y="552" width="120" height="78" rx="9" fill="#FCFAF6" stroke="#64879A" stroke-width="1.5"/><rect x="84" y="561" width="102" height="48" rx="5" fill="#64879A" stroke="none" stroke-width="1.5"/><circle cx="110" cy="580" r="8" fill="#FFFFFF"/><path d="M93 602 L123 584 L141 601 L163 579 L179 603 Z" fill="#FFFFFF" opacity=".82"/><text x="135" y="650" class="small" text-anchor="middle">00:12</text><rect x="235" y="552" width="120" height="78" rx="9" fill="#FCFAF6" stroke="#6E8D73" stroke-width="1.5"/><rect x="244" y="561" width="102" height="48" rx="5" fill="#6E8D73" stroke="none" stroke-width="1.5"/><circle cx="270" cy="580" r="8" fill="#FFFFFF"/><path d="M253 602 L283 584 L301 601 L323 579 L339 603 Z" fill="#FFFFFF" opacity=".82"/><text x="295" y="650" class="small" text-anchor="middle">00:16</text><rect x="395" y="552" width="120" height="78" rx="9" fill="#FCFAF6" stroke="#83739A" stroke-width="1.5"/><rect x="404" y="561" width="102" height="48" rx="5" fill="#83739A" stroke="none" stroke-width="1.5"/><circle cx="430" cy="580" r="8" fill="#FFFFFF"/><path d="M413 602 L443 584 L461 601 L483 579 L499 603 Z" fill="#FFFFFF" opacity=".82"/><text x="455" y="650" class="small" text-anchor="middle">00:21</text><rect x="555" y="552" width="120" height="78" rx="9" fill="#FCFAF6" stroke="#B77C58" stroke-width="1.5"/><rect x="564" y="561" width="102" height="48" rx="5" fill="#B77C58" stroke="none" stroke-width="1.5"/><circle cx="590" cy="580" r="8" fill="#FFFFFF"/><path d="M573 602 L603 584 L621 601 L643 579 L659 603 Z" fill="#FFFFFF" opacity=".82"/><text x="615" y="650" class="small" text-anchor="middle">00:28</text><rect x="715" y="552" width="120" height="78" rx="9" fill="#FCFAF6" stroke="#64879A" stroke-width="1.5"/><rect x="724" y="561" width="102" height="48" rx="5" fill="#64879A" stroke="none" stroke-width="1.5"/><circle cx="750" cy="580" r="8" fill="#FFFFFF"/><path d="M733 602 L763 584 L781 601 L803 579 L819 603 Z" fill="#FFFFFF" opacity=".82"/><text x="775" y="650" class="small" text-anchor="middle">00:34</text><rect x="875" y="552" width="120" height="78" rx="9" fill="#FCFAF6" stroke="#6E8D73" stroke-width="1.5"/><rect x="884" y="561" width="102" height="48" rx="5" fill="#6E8D73" stroke="none" stroke-width="1.5"/><circle cx="910" cy="580" r="8" fill="#FFFFFF"/><path d="M893 602 L923 584 L941 601 L963 579 L979 603 Z" fill="#FFFFFF" opacity=".82"/><text x="935" y="650" class="small" text-anchor="middle">00:39</text><line x1="195" y1="590" x2="231" y2="590" class="arrow"/><line x1="355" y1="590" x2="391" y2="590" class="arrow"/><line x1="515" y1="590" x2="551" y2="590" class="arrow"/><line x1="675" y1="590" x2="711" y2="590" class="arrow"/><line x1="835" y1="590" x2="871" y2="590" class="arrow"/><text x="75" y="690" class="small">保留時間戳、片段順序與跨片段關係，避免只取單張影格而失去事件脈絡。</text></svg>
