<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">多模態 RAG 的證據融合流程</title><desc id="d">多種候選證據經分數正規化、跨模態對齊、冗餘消除與上下文選擇，形成精簡證據集合。</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77746D"/></marker>
<style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#37352F}.eyebrow{font-size:15px;letter-spacing:2px;fill:#77746D}.heading{font-size:32px;font-weight:700}.sub{font-size:20px;font-weight:600}.body{font-size:17px}.small{font-size:14px;fill:#77746D}.arrow{stroke:#77746D;stroke-width:2;fill:none;marker-end:url(#arr)}</style></defs>
<rect width="1200" height="720" rx="26" fill="#F7F2E9"/><text x="64" y="58" class="eyebrow">EVIDENCE FUSION / 03</text><text x="64" y="108" class="heading">把不同來源的證據整理成可用上下文</text><text x="64" y="145" class="body">融合的目標不是堆更多資料，而是保留相關、互補且可追溯的內容。</text><rect x="65" y="205" width="235" height="75" rx="16" fill="#DFEAF0" stroke="#D8D0C4" stroke-width="1.5"/><circle cx="93" cy="242" r="7" fill="#64879A"/><text x="113" y="249" class="sub">文字／段落</text><path d="M300 242 C340 242,330 380,365 380" stroke="#77746D" stroke-width="1.7" fill="none"/><rect x="65" y="300" width="235" height="75" rx="16" fill="#F3E0D1" stroke="#D8D0C4" stroke-width="1.5"/><circle cx="93" cy="337" r="7" fill="#B77C58"/><text x="113" y="344" class="sub">OCR／文件頁面</text><path d="M300 337 C340 337,330 380,365 380" stroke="#77746D" stroke-width="1.7" fill="none"/><rect x="65" y="395" width="235" height="75" rx="16" fill="#DDE8D8" stroke="#D8D0C4" stroke-width="1.5"/><circle cx="93" cy="432" r="7" fill="#6E8D73"/><text x="113" y="439" class="sub">視覺區塊／圖片</text><path d="M300 432 C340 432,330 380,365 380" stroke="#77746D" stroke-width="1.7" fill="none"/><rect x="65" y="490" width="235" height="75" rx="16" fill="#E8E3EF" stroke="#D8D0C4" stroke-width="1.5"/><circle cx="93" cy="527" r="7" fill="#83739A"/><text x="113" y="534" class="sub">表格／影片片段</text><path d="M300 527 C340 527,330 380,365 380" stroke="#77746D" stroke-width="1.7" fill="none"/><circle cx="365" cy="380" r="7" fill="#77746D"/><line x1="372" y1="380" x2="402" y2="380" class="arrow"/><rect x="410" y="205" width="310" height="70" rx="16" fill="#DFEAF0" stroke="#D8D0C4" stroke-width="1.5"/><text x="428" y="234" class="sub">1  分數正規化</text><text x="428" y="258" class="small">讓不同檢索器的分數可比較</text><rect x="410" y="300" width="310" height="70" rx="16" fill="#E8E3EF" stroke="#D8D0C4" stroke-width="1.5"/><text x="428" y="329" class="sub">2  跨模態對齊</text><text x="428" y="353" class="small">判斷證據是否回應同一問題</text><rect x="410" y="395" width="310" height="70" rx="16" fill="#F3E0D1" stroke="#D8D0C4" stroke-width="1.5"/><text x="428" y="424" class="sub">3  冗餘消除</text><text x="428" y="448" class="small">合併重複內容，保留互補證據</text><rect x="410" y="490" width="310" height="70" rx="16" fill="#DDE8D8" stroke="#D8D0C4" stroke-width="1.5"/><text x="428" y="519" class="sub">4  上下文選擇</text><text x="428" y="543" class="small">兼顧相關性、覆蓋度與長度</text><line x1="565" y1="275" x2="565" y2="296" class="arrow"/><line x1="565" y1="370" x2="565" y2="391" class="arrow"/><line x1="565" y1="465" x2="565" y2="486" class="arrow"/><line x1="720" y1="525" x2="765" y2="525" class="arrow"/><rect x="780" y="315" width="350" height="155" rx="20" fill="#FCFAF6" stroke="#6E8D73" stroke-width="1.5"/><text x="955" y="355" class="sub" text-anchor="middle">精簡的證據上下文</text><text x="955" y="390" class="body" text-anchor="middle">相關 · 互補 · 低冗餘</text><text x="955" y="421" class="small" text-anchor="middle">附帶來源與位置資訊</text><text x="780" y="510" class="small">送入生成模型</text><text x="65" y="625" class="small">不同來源的分數尺度與證據品質可能不同；正規化與融合規則應以實際資料集評估。</text></svg>
