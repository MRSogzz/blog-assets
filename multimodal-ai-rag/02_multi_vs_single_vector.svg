<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">多向量與單向量檢索表示法比較</title><desc id="d">多向量以多個局部區塊表示頁面，單向量以一個向量表示整體；圖示不代表固定效能或儲存比例。</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77746D"/></marker>
<style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#37352F}.eyebrow{font-size:15px;letter-spacing:2px;fill:#77746D}.heading{font-size:32px;font-weight:700}.sub{font-size:20px;font-weight:600}.body{font-size:17px}.small{font-size:14px;fill:#77746D}.arrow{stroke:#77746D;stroke-width:2;fill:none;marker-end:url(#arr)}</style></defs>
<rect width="1200" height="720" rx="26" fill="#F7F2E9"/><text x="64" y="58" class="eyebrow">REPRESENTATION / 02</text><text x="64" y="108" class="heading">一頁文件，如何變成可檢索的表示？</text><text x="64" y="145" class="body">多向量保留局部細節；單向量用較濃縮的表示描述整體。</text><rect x="55" y="190" width="525" height="365" rx="16" fill="#FCFAF6" stroke="#D8D0C4" stroke-width="1.5"/><text x="85" y="232" class="sub">多向量表示</text><text x="85" y="260" class="small">例：ColPali 類方法</text><rect x="85" y="285" width="145" height="205" rx="10" fill="#FFFFFF" stroke="#D8D0C4" stroke-width="1.5"/><rect x="101" y="302" width="112" height="30" rx="5" fill="#F3E0D1" stroke="#B77C58" stroke-width="1.5"/><text x="157" y="322" class="small" text-anchor="middle">標題</text><rect x="101" y="344" width="48" height="54" rx="5" fill="#DFEAF0" stroke="#64879A" stroke-width="1.5"/><rect x="158" y="344" width="55" height="54" rx="5" fill="#DDE8D8" stroke="#6E8D73" stroke-width="1.5"/><rect x="101" y="408" width="112" height="12" rx="4" fill="#E8E3EF" stroke="#83739A" stroke-width="1.5"/><rect x="101" y="429" width="112" height="12" rx="4" fill="#E8E3EF" stroke="#83739A" stroke-width="1.5"/><rect x="101" y="450" width="76" height="12" rx="4" fill="#E8E3EF" stroke="#83739A" stroke-width="1.5"/><line x1="238" y1="310" x2="278" y2="310" class="arrow"/><rect x="286" y="300" width="220" height="28" rx="8" fill="#F3E0D1" stroke="#D8D0C4" stroke-width="1.5"/><text x="301" y="319" class="small">標題區塊</text><circle cx="475" cy="314" r="3" fill="#37352F"/><circle cx="486" cy="314" r="3" fill="#37352F"/><circle cx="497" cy="314" r="3" fill="#37352F"/><line x1="238" y1="355" x2="278" y2="355" class="arrow"/><rect x="286" y="345" width="220" height="28" rx="8" fill="#DFEAF0" stroke="#D8D0C4" stroke-width="1.5"/><text x="301" y="364" class="small">圖像區塊</text><circle cx="475" cy="359" r="3" fill="#37352F"/><circle cx="486" cy="359" r="3" fill="#37352F"/><circle cx="497" cy="359" r="3" fill="#37352F"/><line x1="238" y1="400" x2="278" y2="400" class="arrow"/><rect x="286" y="390" width="220" height="28" rx="8" fill="#DDE8D8" stroke="#D8D0C4" stroke-width="1.5"/><text x="301" y="409" class="small">表格區塊</text><circle cx="475" cy="404" r="3" fill="#37352F"/><circle cx="486" cy="404" r="3" fill="#37352F"/><circle cx="497" cy="404" r="3" fill="#37352F"/><line x1="238" y1="445" x2="278" y2="445" class="arrow"/><rect x="286" y="435" width="220" height="28" rx="8" fill="#E8E3EF" stroke="#D8D0C4" stroke-width="1.5"/><text x="301" y="454" class="small">文字區塊</text><circle cx="475" cy="449" r="3" fill="#37352F"/><circle cx="486" cy="449" r="3" fill="#37352F"/><circle cx="497" cy="449" r="3" fill="#37352F"/><text x="85" y="520" class="body">優勢：較能對應局部細節與精確匹配</text><rect x="620" y="190" width="525" height="365" rx="16" fill="#FCFAF6" stroke="#D8D0C4" stroke-width="1.5"/><text x="650" y="232" class="sub">單向量表示</text><text x="650" y="260" class="small">例：VisRAG 類方法</text><rect x="660" y="285" width="145" height="205" rx="10" fill="#FFFFFF" stroke="#D8D0C4" stroke-width="1.5"/><rect x="676" y="302" width="112" height="30" rx="5" fill="#F3E0D1" stroke="#B77C58" stroke-width="1.5"/><rect x="676" y="344" width="48" height="54" rx="5" fill="#DFEAF0" stroke="#64879A" stroke-width="1.5"/><rect x="733" y="344" width="55" height="54" rx="5" fill="#DDE8D8" stroke="#6E8D73" stroke-width="1.5"/><rect x="676" y="408" width="112" height="12" rx="4" fill="#E8E3EF" stroke="#83739A" stroke-width="1.5"/><rect x="676" y="429" width="112" height="12" rx="4" fill="#E8E3EF" stroke="#83739A" stroke-width="1.5"/><rect x="676" y="450" width="76" height="12" rx="4" fill="#E8E3EF" stroke="#83739A" stroke-width="1.5"/><line x1="815" y1="387" x2="860" y2="387" class="arrow"/><rect x="875" y="345" width="215" height="82" rx="14" fill="#E8E3EF" stroke="#83739A" stroke-width="1.5"/><text x="982" y="377" class="sub" text-anchor="middle">單一頁面向量</text><text x="982" y="403" class="small" text-anchor="middle">整體語意表示</text><text x="650" y="520" class="body">優勢：表示較精簡，檢索流程可能較簡單</text><rect x="75" y="585" width="1050" height="78" rx="16" fill="#DDE8D8" stroke="#6E8D73" stroke-width="1.5"/><text x="100" y="617" class="sub">選擇時比較</text><text x="265" y="617" class="body">局部匹配能力 · 索引規模 · 延遲 · 儲存成本 · 文件類型</text><text x="100" y="645" class="small">實際成本取決於向量數量、維度、精度、索引設定與資料規模；不應假設固定比例。</text></svg>
