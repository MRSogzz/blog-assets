<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#fbf8f1"/><g font-family="Arial,sans-serif" fill="#3f3a35"><text x="70" y="68" font-size="30" font-weight="600">From Image to LLM</text><text x="70" y="104" font-size="17" fill="#756d64">Vision Encoder 的輸出通常還需要經過 Projector，才能接軌語言模型</text></g><g transform="translate(70 190)"><rect width="190" height="170" rx="20" fill="#e8dfcf" stroke="#8d8172" stroke-width="2"/><circle cx="95" cy="70" r="38" fill="#d5c8b5" stroke="#8d8172" stroke-width="2"/><path d="M72 72l23-24 23 24-23 24z" fill="none" stroke="#6f655a" stroke-width="3"/><text x="95" y="137" text-anchor="middle" font-size="20" font-weight="600">Image</text></g><g stroke="#8d8172" stroke-width="3" fill="none"><path d="M280 275h95" marker-end="url(#a)"/></g><g transform="translate(395 165)"><rect width="235" height="220" rx="20" fill="#f1e8da" stroke="#8d8172" stroke-width="2"/><text x="117" y="58" text-anchor="middle" font-size="21" font-weight="600">Vision Encoder</text><g fill="#d1c3ae"><rect x="35" y="90" width="42" height="42" rx="6"/><rect x="96" y="90" width="42" height="42" rx="6"/><rect x="157" y="90" width="42" height="42" rx="6"/></g><text x="117" y="174" text-anchor="middle" font-size="16" fill="#756d64">Image → Visual Tokens</text></g><g stroke="#8d8172" stroke-width="3" fill="none"><path d="M650 275h95" marker-end="url(#a)"/></g><g transform="translate(765 165)"><rect width="180" height="220" rx="20" fill="#eee7dc" stroke="#8d8172" stroke-width="2"/><text x="90" y="58" text-anchor="middle" font-size="21" font-weight="600">Projector</text><path d="M45 105h90M45 135h90M45 165h90" stroke="#9a8b79" stroke-width="7" stroke-linecap="round"/><text x="90" y="197" text-anchor="middle" font-size="15" fill="#756d64">Dimension Alignment</text></g><g stroke="#8d8172" stroke-width="3" fill="none"><path d="M965 275h95" marker-end="url(#a)"/></g><g transform="translate(1080 165)"><rect width="70" height="220" rx="18" fill="#e5ddd1" stroke="#8d8172" stroke-width="2"/><text x="35" y="105" text-anchor="middle" font-size="17" font-weight="600" transform="rotate(-90 35 105)">LLM</text></g><text x="600" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#756d64">Image → Encoder → Visual Tokens → Projector → LLM</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#8d8172"/></marker></defs></svg>