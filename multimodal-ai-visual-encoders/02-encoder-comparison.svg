<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#fbf8f1"/><g font-family="Arial,sans-serif" fill="#3f3a35"><text x="70" y="70" font-size="30" font-weight="600">Vision Encoder：三種不同的「看法」</text><text x="70" y="106" font-size="17" fill="#756d64">不是誰的模型最大，而是它學到的視覺表示是否適合你的任務</text></g><g transform="translate(70 150)"><rect width="320" height="400" rx="20" fill="#f1e8da" stroke="#9a8b79" stroke-width="2"/><circle cx="160" cy="72" r="35" fill="#d5c8b5" stroke="#8d8172" stroke-width="2"/><text x="160" y="80" text-anchor="middle" font-size="22" font-weight="600" fill="#3f3a35">ViT</text><text x="30" y="145" font-size="19" font-weight="600" fill="#3f3a35">基礎視覺表徵</text><text x="30" y="190" font-size="16" fill="#3f3a35">Patch → Transformer</text><text x="30" y="225" font-size="16" fill="#3f3a35">建立通用 visual tokens</text><text x="30" y="300" font-size="16" fill="#3f3a35">核心：圖片如何變成序列？</text></g><g transform="translate(440 150)"><rect width="320" height="400" rx="20" fill="#eee7dc" stroke="#9a8b79" stroke-width="2"/><circle cx="160" cy="72" r="35" fill="#d5c8b5" stroke="#8d8172" stroke-width="2"/><text x="160" y="80" text-anchor="middle" font-size="20" font-weight="600" fill="#3f3a35">SigLIP</text><text x="30" y="145" font-size="19" font-weight="600" fill="#3f3a35">語意對齊</text><text x="30" y="190" font-size="16" fill="#3f3a35">Image ↔ Text</text><text x="30" y="225" font-size="16" fill="#3f3a35">建立共同語意空間</text><text x="30" y="300" font-size="16" fill="#3f3a35">核心：圖片如何與文字對齊？</text></g><g transform="translate(810 150)"><rect width="320" height="400" rx="20" fill="#f3eee6" stroke="#9a8b79" stroke-width="2"/><circle cx="160" cy="72" r="35" fill="#d5c8b5" stroke="#8d8172" stroke-width="2"/><text x="160" y="80" text-anchor="middle" font-size="20" font-weight="600" fill="#3f3a35">DINOv2</text><text x="30" y="145" font-size="19" font-weight="600" fill="#3f3a35">細粒度視覺特徵</text><text x="30" y="190" font-size="16" fill="#3f3a35">Self-Supervised Learning</text><text x="30" y="225" font-size="16" fill="#3f3a35">保留更多視覺結構</text><text x="30" y="300" font-size="16" fill="#3f3a35">核心：如何學到視覺結構？</text></g><text x="600" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#756d64">Representation ≠ Alignment ≠ Fine-grained Visual Features</text></svg>