<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#fbf8f1"/><g font-family="Arial,sans-serif" fill="#3f3a35"><text x="70" y="70" font-size="30" font-weight="600">How to Choose a Vision Encoder?</text><text x="70" y="106" font-size="17" fill="#756d64">選擇不是單純比較 benchmark，而是看表示能力與系統需求是否匹配</text></g><g transform="translate(455 235)"><circle cx="145" cy="75" r="110" fill="#eee7dc" stroke="#8d8172" stroke-width="3"/><circle cx="145" cy="75" r="55" fill="#d5c8b5" stroke="#8d8172" stroke-width="2"/><text x="145" y="69" text-anchor="middle" font-size="19" font-weight="600">Encoder</text><text x="145" y="94" text-anchor="middle" font-size="14" fill="#5e564d">fit the system</text></g><g transform="translate(90 170)"><rect width="285" height="145" rx="18" fill="#f1e8da" stroke="#9a8b79" stroke-width="2"/><text x="142" y="43" text-anchor="middle" font-size="20" font-weight="600">Task</text><text x="142" y="80" text-anchor="middle" font-size="16">語意理解？細粒度特徵？</text><text x="142" y="108" text-anchor="middle" font-size="16">OCR？定位？通用 VLM？</text></g><g transform="translate(825 170)"><rect width="285" height="145" rx="18" fill="#f3eee6" stroke="#9a8b79" stroke-width="2"/><text x="142" y="43" text-anchor="middle" font-size="20" font-weight="600">Representation</text><text x="142" y="80" text-anchor="middle" font-size="16">Semantic Alignment</text><text x="142" y="108" text-anchor="middle" font-size="16">Fine-grained Features</text></g><g transform="translate(90 400)"><rect width="285" height="145" rx="18" fill="#eee7dc" stroke="#9a8b79" stroke-width="2"/><text x="142" y="43" text-anchor="middle" font-size="20" font-weight="600">System Cost</text><text x="142" y="80" text-anchor="middle" font-size="16">Token 數量 · 記憶體</text><text x="142" y="108" text-anchor="middle" font-size="16">Latency · Throughput</text></g><g transform="translate(825 400)"><rect width="285" height="145" rx="18" fill="#f1e8da" stroke="#9a8b79" stroke-width="2"/><text x="142" y="43" text-anchor="middle" font-size="20" font-weight="600">Compatibility</text><text x="142" y="80" text-anchor="middle" font-size="16">LLM Dimension</text><text x="142" y="108" text-anchor="middle" font-size="16">Projector · Downstream Task</text></g><g stroke="#a89a87" stroke-width="2" fill="none"><path d="M375 242L470 270M825 242L680 270M375 470L470 350M825 470L680 350"/></g><text x="600" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#756d64">Best encoder = the one that fits the downstream objective</text></svg>