<rect width="1200" height="840" rx="28" fill="url(#bg)"/><rect width="1200" height="840" rx="28" fill="url(#grain)"/>
<text x="74" y="70" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#758777">MULTIMODAL AI · BENCHMARK MAP</text>
<text x="74" y="121" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="36" font-weight="700" fill="#343A35">不同基準，回答不同問題</text>
<text x="76" y="154" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#68716A">按主要評估目的整理；分類並非互斥，各基準的能力範圍可能重疊。</text>
