<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">從基準測試到持續評估</title>
<desc id="desc">依文章提出的評估方向整理出的建議流程：基準測試、分析失敗模式、對抗性與真實任務測試、收集新案例、更新評估集並持續監控。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBF8F1"/><stop offset="1" stop-color="#F1EBDD"/></linearGradient><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r="1" fill="#B8AD9B" opacity=".17"/></pattern><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#756D60" flood-opacity=".1"/></filter></defs>
<rect width="1200" height="790" rx="28" fill="url(#bg)"/><rect width="1200" height="790" rx="28" fill="url(#grain)"/>
<text x="74" y="70" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#758777">MULTIMODAL AI · EVALUATION LOOP</text>
<text x="74" y="121" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="36" font-weight="700" fill="#343A35">評估不是一次測驗，而是持續循環</text>
<text x="76" y="155" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#68716A">把靜態基準、失敗分析、真實任務與部署監控串成可反覆執行的流程。</text>
<g filter="url(#shadow)"><rect x="90" y="235" width="430" height="145" rx="20" fill="#FFFCF6" stroke="#DED7CA"/><rect x="110" y="255" width="43" height="36" rx="11" fill="#DCE9E1" stroke="#527A68" stroke-opacity=".25"/><text x="131.5" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#527A68">01</text><text x="169" y="279" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#527A68">基準測試</text><text x="112" y="323" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14.5" fill="#505950">使用適合任務的基準，建立可比較的初始結果</text></g><g filter="url(#shadow)"><rect x="680" y="235" width="430" height="145" rx="20" fill="#FFFCF6" stroke="#DED7CA"/><rect x="700" y="255" width="43" height="36" rx="11" fill="#E8E0F2" stroke="#806A9C" stroke-opacity=".25"/><text x="721.5" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#806A9C">02</text><text x="759" y="279" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#806A9C">分析失敗模式</text><text x="702" y="323" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14.5" fill="#505950">檢查幻覺、語言先驗、推理錯誤與校準問題</text></g><g filter="url(#shadow)"><rect x="680" y="470" width="430" height="145" rx="20" fill="#FFFCF6" stroke="#DED7CA"/><rect x="700" y="490" width="43" height="36" rx="11" fill="#DCE7F2" stroke="#567A9C" stroke-opacity=".25"/><text x="721.5" y="513" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#567A9C">03</text><text x="759" y="514" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#567A9C">對抗性與真實任務測試</text><text x="702" y="558" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14.5" fill="#505950">加入邊界案例、分佈外樣本與多步驟任務</text></g><g filter="url(#shadow)"><rect x="90" y="470" width="430" height="145" rx="20" fill="#FFFCF6" stroke="#DED7CA"/><rect x="110" y="490" width="43" height="36" rx="11" fill="#F4DFD7" stroke="#B66F5B" stroke-opacity=".25"/><text x="131.5" y="513" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#B66F5B">04</text><text x="169" y="514" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#B66F5B">更新評估集並持續監控</text><text x="112" y="558" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14.5" fill="#505950">將新失敗案例納入測試，追蹤部署後表現</text></g>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8D9B8B"/></marker></defs>
<g fill="none" stroke="#8D9B8B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
 <path d="M520 307 H640"/>
 <path d="M895 380 V445"/>
 <path d="M680 542 H550"/>
 <path d="M305 470 V415 Q305 402 318 402 H570 Q600 402 600 373 V205 Q600 190 585 190 H305 Q285 190 285 215 V226"/>
</g>
<rect x="430" y="410" width="340" height="42" rx="21" fill="#E9E5DA" stroke="#D8D0C1"/>
<text x="600" y="436" text-anchor="middle" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="15" font-weight="700" fill="#50584F">新案例回流，重新測試</text>
<rect x="90" y="660" width="1020" height="65" rx="16" fill="#E9E5DA" stroke="#D8D0C1"/>
<text x="115" y="686" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="15" font-weight="700" fill="#424A42">評估原則</text>
<text x="115" y="709" font-family="Noto Sans TC,Microsoft JhengHei,sans-serif" font-size="14" fill="#5E665D">不要只看單一準確率：同時檢查校準、魯棒性、效率，以及真實任務是否成功。</text>
<text x="1128" y="759" text-anchor="end" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.3" fill="#969184">03 / CONTINUOUS EVALUATION</text>
</svg>