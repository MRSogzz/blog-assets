<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">多模態 Agent 四層概念架構</title><desc id="desc">感知、解讀、規劃、執行四層；記憶作為跨層支援模組，而非固定的第五層。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6E8D73"/></marker>
<marker id="arrowInk" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#77736B"/></marker>
<style>text{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#37352F}.heading{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#77736B}.label{font-size:22px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#77736B}</style>
</defs><text x="60" y="60" class="heading" text-anchor="start">多模態 Agent 的四層概念架構</text><text x="60" y="91" class="sub" text-anchor="start">這是一種便於理解的概念分層；實際系統不一定採用相同模組邊界。</text><rect x="80" y="135" width="770" height="112" rx="18" fill="#DFEAF0" stroke="#D8D1C5" stroke-width="2"/><text x="104" y="173" class="label" text-anchor="start">01  感知層 Perception</text><text x="104" y="203" class="body" text-anchor="start">接收畫面、文字、語音或結構化狀態</text><text x="104" y="229" class="small" text-anchor="start">把原始輸入轉成可處理的觀察</text><rect x="80" y="267" width="770" height="112" rx="18" fill="#E8E3EF" stroke="#D8D1C5" stroke-width="2"/><text x="104" y="305" class="label" text-anchor="start">02  解讀層 Interpretation</text><text x="104" y="335" class="body" text-anchor="start">辨識物件、介面元素、意圖與情境</text><text x="104" y="361" class="small" text-anchor="start">建立當前狀態的表示</text><rect x="80" y="399" width="770" height="112" rx="18" fill="#F7F2E9" stroke="#D8D1C5" stroke-width="2"/><text x="104" y="437" class="label" text-anchor="start">03  規劃層 Planning</text><text x="104" y="467" class="body" text-anchor="start">拆解目標、選擇工具、安排下一步</text><text x="104" y="493" class="small" text-anchor="start">考量前置條件與可能結果</text><rect x="80" y="531" width="770" height="112" rx="18" fill="#DDE8D8" stroke="#D8D1C5" stroke-width="2"/><text x="104" y="569" class="label" text-anchor="start">04  執行層 Execution</text><text x="104" y="599" class="body" text-anchor="start">呼叫工具、操作介面、執行動作</text><text x="104" y="625" class="small" text-anchor="start">回報結果並觸發下一輪觀察</text><line x1="465" y1="247" x2="465" y2="262" stroke="#6E8D73" stroke-width="2.5" marker-end="url(#arrow)" stroke-linecap="round"/><line x1="465" y1="379" x2="465" y2="394" stroke="#6E8D73" stroke-width="2.5" marker-end="url(#arrow)" stroke-linecap="round"/><line x1="465" y1="511" x2="465" y2="526" stroke="#6E8D73" stroke-width="2.5" marker-end="url(#arrow)" stroke-linecap="round"/><rect x="900" y="250" width="230" height="270" rx="20" fill="#F3E0D1" stroke="#D8D1C5" stroke-width="2"/><text x="1015" y="290" class="label" text-anchor="middle">跨層支援</text><text x="1015" y="325" class="label" text-anchor="middle">記憶 Memory</text><line x1="925" y1="343" x2="1105" y2="343" stroke="#D8D1C5" stroke-width="1.5"/><text x="1015" y="378" class="body" text-anchor="middle">保存任務狀態</text><text x="1015" y="408" class="body" text-anchor="middle">記錄過往結果</text><text x="1015" y="438" class="body" text-anchor="middle">提供後續參考</text><text x="1015" y="480" class="small" text-anchor="middle">不是固定的第五層</text><path d="M850 190 H875 V360 H895" fill="none" stroke="#83739A" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowInk)"/><path d="M895 430 H875 V585 H850" fill="none" stroke="#83739A" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowInk)"/><rect x="80" y="675" width="1050" height="48" rx="14" fill="#FCFAF6" stroke="#D8D1C5" stroke-width="1.5"/><text x="605" y="705" class="body" text-anchor="middle">執行結果回到觀察流程；記憶可在不同階段提供上下文。</text></svg>