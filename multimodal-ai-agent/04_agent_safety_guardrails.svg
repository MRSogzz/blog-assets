<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">多模態 Agent 安全護欄</title><desc id="desc">六項安全措施圍繞使用者授權、可信任的規則、動作執行與結果檢查。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6E8D73"/></marker>
<marker id="arrowInk" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#77736B"/></marker>
<style>text{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#37352F}.heading{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#77736B}.label{font-size:22px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#77736B}</style>
</defs><text x="60" y="62" class="heading" text-anchor="start">多模態 Agent 的六項安全護欄</text><text x="60" y="94" class="sub" text-anchor="start">畫面、文件與彈出視窗可能含有不可信指令；它們不應自動覆蓋使用者授權。</text><rect x="60" y="155" width="250" height="120" rx="18" fill="#DFEAF0" stroke="#D8D1C5" stroke-width="2"/><text x="185" y="192" class="label" text-anchor="middle">使用者目標</text><text x="185" y="222" class="body" text-anchor="middle">明確任務與授權範圍</text><rect x="390" y="155" width="250" height="120" rx="18" fill="#E8E3EF" stroke="#D8D1C5" stroke-width="2"/><text x="515" y="192" class="label" text-anchor="middle">Agent 判斷</text><text x="515" y="222" class="body" text-anchor="middle">檢查上下文與動作風險</text><rect x="720" y="155" width="250" height="120" rx="18" fill="#DDE8D8" stroke="#D8D1C5" stroke-width="2"/><text x="845" y="192" class="label" text-anchor="middle">受控執行</text><text x="845" y="222" class="body" text-anchor="middle">只執行允許的操作</text><line x1="310" y1="215" x2="382" y2="215" stroke="#6E8D73" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round"/><line x1="640" y1="215" x2="712" y2="215" stroke="#6E8D73" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round"/><path d="M845 275 V315 H185 V282" fill="none" stroke="#6E8D73" stroke-width="2.5" marker-end="url(#arrow)"/><text x="515" y="306" class="small" text-anchor="middle">結果回報與重新檢查</text><text x="60" y="365" class="label" text-anchor="start">落實到系統的六個檢查點</text><rect x="60" y="395" width="330" height="105" rx="16" fill="#F7F2E9" stroke="#D8D1C5" stroke-width="2"/><text x="78" y="430" class="body" text-anchor="start">01  授權邊界</text><text x="78" y="462" class="small" text-anchor="start">只執行使用者允許的操作</text><rect x="435" y="395" width="330" height="105" rx="16" fill="#F3E0D1" stroke="#D8D1C5" stroke-width="2"/><text x="453" y="430" class="body" text-anchor="start">02  不可信輸入隔離</text><text x="453" y="462" class="small" text-anchor="start">不把網頁／彈窗指令當成系統規則</text><rect x="810" y="395" width="330" height="105" rx="16" fill="#DFEAF0" stroke="#D8D1C5" stroke-width="2"/><text x="828" y="430" class="body" text-anchor="start">03  高風險動作確認</text><text x="828" y="462" class="small" text-anchor="start">付款、刪除等操作需額外確認</text><rect x="60" y="525" width="330" height="105" rx="16" fill="#E8E3EF" stroke="#D8D1C5" stroke-width="2"/><text x="78" y="560" class="body" text-anchor="start">04  最小權限</text><text x="78" y="592" class="small" text-anchor="start">工具只取得任務所需權限</text><rect x="435" y="525" width="330" height="105" rx="16" fill="#DDE8D8" stroke="#D8D1C5" stroke-width="2"/><text x="453" y="560" class="body" text-anchor="start">05  執行前後驗證</text><text x="453" y="592" class="small" text-anchor="start">檢查目標、參數與實際結果</text><rect x="810" y="525" width="330" height="105" rx="16" fill="#F7F2E9" stroke="#D8D1C5" stroke-width="2"/><text x="828" y="560" class="body" text-anchor="start">06  記錄與停止機制</text><text x="828" y="592" class="small" text-anchor="start">保留可稽核紀錄，異常時停止</text><rect x="60" y="665" width="1080" height="48" rx="14" fill="#FCFAF6" stroke="#D8D1C5" stroke-width="1.5"/><text x="600" y="695" class="body" text-anchor="middle">安全設計不是單一提示詞；需要授權、工具限制、驗證與可恢復流程共同配合。</text></svg>