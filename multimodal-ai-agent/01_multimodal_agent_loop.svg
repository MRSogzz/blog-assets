<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">多模態 Agent 的行動循環</title><desc id="desc">Observe、Understand、Reason、Plan、Act，並透過結果回到 Observe 的循環流程。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6E8D73"/></marker>
<marker id="arrowInk" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#77736B"/></marker>
<style>text{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#37352F}.heading{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#77736B}.label{font-size:22px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#77736B}</style>
</defs><text x="60" y="65" class="heading" text-anchor="start">多模態 Agent：從觀察到行動</text><text x="60" y="96" class="sub" text-anchor="start">行動結果會成為下一輪觀察的一部分，而不是一次性的線性流程。</text><rect x="60" y="180" width="160" height="105" rx="20" fill="#DFEAF0" stroke="#D8D1C5" stroke-width="2"/><text x="140.0" y="222" class="label" text-anchor="middle">Observe</text><text x="140.0" y="252" class="body" text-anchor="middle">觀察環境</text><rect x="265" y="180" width="160" height="105" rx="20" fill="#E8E3EF" stroke="#D8D1C5" stroke-width="2"/><text x="345.0" y="222" class="label" text-anchor="middle">Understand</text><text x="345.0" y="252" class="body" text-anchor="middle">整理訊息</text><rect x="470" y="180" width="160" height="105" rx="20" fill="#F7F2E9" stroke="#D8D1C5" stroke-width="2"/><text x="550.0" y="222" class="label" text-anchor="middle">Reason</text><text x="550.0" y="252" class="body" text-anchor="middle">推理問題</text><rect x="675" y="180" width="160" height="105" rx="20" fill="#F3E0D1" stroke="#D8D1C5" stroke-width="2"/><text x="755.0" y="222" class="label" text-anchor="middle">Plan</text><text x="755.0" y="252" class="body" text-anchor="middle">規劃步驟</text><rect x="880" y="180" width="160" height="105" rx="20" fill="#DDE8D8" stroke="#D8D1C5" stroke-width="2"/><text x="960.0" y="222" class="label" text-anchor="middle">Act</text><text x="960.0" y="252" class="body" text-anchor="middle">執行動作</text><line x1="220" y1="232" x2="258" y2="232" stroke="#6E8D73" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round"/><line x1="425" y1="232" x2="463" y2="232" stroke="#6E8D73" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round"/><line x1="630" y1="232" x2="668" y2="232" stroke="#6E8D73" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round"/><line x1="835" y1="232" x2="873" y2="232" stroke="#6E8D73" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round"/><path d="M960 290 V365 Q960 395 930 395 H140 Q110 395 110 365 V300" fill="none" stroke="#6E8D73" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/><text x="550" y="430" class="body" text-anchor="middle">回饋：檢查結果、更新狀態，再次觀察</text><rect x="300" y="470" width="600" height="48" rx="14" fill="#FCFAF6" stroke="#D8D1C5" stroke-width="1.5"/><text x="600" y="500" class="small" text-anchor="middle">循環可持續多輪；每一步都可能需要重新判斷。</text></svg>