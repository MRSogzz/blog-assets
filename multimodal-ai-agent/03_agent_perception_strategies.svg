<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Agent 感知策略比較</title><desc id="desc">比較純視覺、混合感知、輕量視覺增強三種常見設計方向，並標示其取捨。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6E8D73"/></marker>
<marker id="arrowInk" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#77736B"/></marker>
<style>text{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#37352F}.heading{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#77736B}.label{font-size:22px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#77736B}</style>
</defs><text x="60" y="62" class="heading" text-anchor="start">Agent 感知策略：不同方法，不同取捨</text><text x="60" y="94" class="sub" text-anchor="start">以下是設計方向的概念比較，不代表所有系統都能直接歸入單一類別。</text><rect x="55" y="150" width="345" height="390" rx="22" fill="#DFEAF0" stroke="#D8D1C5" stroke-width="2"/><text x="77" y="192" class="label" text-anchor="start">純視覺感知</text><text x="77" y="220" class="small" text-anchor="start">Pure Vision</text><text x="77" y="262" class="body" text-anchor="start">主要依賴截圖與視覺模型</text><line x1="77" y1="290" x2="378" y2="290" stroke="#D8D1C5" stroke-width="1.5"/><text x="77" y="330" class="body" text-anchor="start">優點</text><text x="77" y="360" class="small" text-anchor="start">可直接利用畫面外觀</text><text x="77" y="415" class="body" text-anchor="start">注意</text><text x="77" y="444" class="small" text-anchor="start">細小文字、座標定位與</text><text x="77" y="466" class="small" text-anchor="start">高解析畫面可能較具挑戰</text><rect x="427" y="150" width="345" height="390" rx="22" fill="#E8E3EF" stroke="#D8D1C5" stroke-width="2"/><text x="449" y="192" class="label" text-anchor="start">混合式感知</text><text x="449" y="220" class="small" text-anchor="start">Hybrid Perception</text><text x="449" y="262" class="body" text-anchor="start">視覺搭配 DOM、OCR 或結構化資訊</text><line x1="449" y1="290" x2="750" y2="290" stroke="#D8D1C5" stroke-width="1.5"/><text x="449" y="330" class="body" text-anchor="start">優點</text><text x="449" y="360" class="small" text-anchor="start">多種訊號可互相補充</text><text x="449" y="415" class="body" text-anchor="start">注意</text><text x="449" y="444" class="small" text-anchor="start">依賴可取得的結構化資料，</text><text x="449" y="466" class="small" text-anchor="start">整合成本可能較高</text><rect x="799" y="150" width="345" height="390" rx="22" fill="#DDE8D8" stroke="#D8D1C5" stroke-width="2"/><text x="821" y="192" class="label" text-anchor="start">輕量視覺增強</text><text x="821" y="220" class="small" text-anchor="start">Lightweight Vision</text><text x="821" y="262" class="body" text-anchor="start">以較輕量的視覺模組輔助既有流程</text><line x1="821" y1="290" x2="1122" y2="290" stroke="#D8D1C5" stroke-width="1.5"/><text x="821" y="330" class="body" text-anchor="start">優點</text><text x="821" y="360" class="small" text-anchor="start">有機會降低部分感知成本</text><text x="821" y="415" class="body" text-anchor="start">注意</text><text x="821" y="444" class="small" text-anchor="start">效果取決於任務、模組品質</text><text x="821" y="466" class="small" text-anchor="start">與實際整合方式</text><rect x="55" y="575" width="1089" height="64" rx="16" fill="#FCFAF6" stroke="#D8D1C5" stroke-width="1.5"/><text x="600" y="603" class="body" text-anchor="middle">選型時要一起考慮：準確度、延遲、成本、可用訊號與失敗後的恢復能力。</text><text x="600" y="625" class="small" text-anchor="middle">這些方法可以組合使用；比較的重點是系統需求，而不是單一排名。</text></svg>