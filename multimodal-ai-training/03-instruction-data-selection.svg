<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
<defs><style>
.h{font:700 30px 'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#263D56}
.sub{font:500 17px 'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#536878}
.label{font:700 19px 'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#263D56}
.body{font:500 15px 'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#43596A}
.small{font:500 13px 'Noto Sans TC','Microsoft JhengHei',sans-serif;fill:#536878}
</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#718B91"/></marker></defs>
<rect width="1200" height="600" rx="28" fill="#FBF8F0"/>
<circle cx="65" cy="60" r="25" fill="#D9EEE7"/><text x="65" y="68" text-anchor="middle" class="label">03</text>
<text x="108" y="68" class="h">指令數據篩選</text>
<text x="60" y="108" class="sub">不是資料越多越好：先評估品質與多樣性，再選擇符合訓練目標的樣本。</text>
<!-- process cards -->
<g>
<rect x="50" y="165" width="235" height="250" rx="18" fill="#EEF4F8" stroke="#A8C7DC" stroke-width="2"/>
<circle cx="88" cy="205" r="19" fill="#C9DDEB"/><ellipse cx="88" cy="199" rx="11" ry="5" fill="#5D7D98"/><path d="M77 199V211C77 218 99 218 99 211V199M77 205C77 212 99 212 99 205" fill="none" stroke="#5D7D98" stroke-width="2"/>
<text x="120" y="212" class="label">原始數據</text>
<text x="75" y="260" class="body">• 圖文配對</text><text x="95" y="284" class="small">圖片 + 描述</text>
<text x="75" y="322" class="body">• 視覺指令</text><text x="95" y="346" class="small">問答、對話、推理</text>
<text x="75" y="385" class="small">可能含噪聲與重複內容</text>
<rect x="315" y="165" width="235" height="250" rx="18" fill="#F0ECFA" stroke="#B9A9E2" stroke-width="2"/>
<circle cx="354" cy="205" r="19" fill="#DCD2F1"/><circle cx="351" cy="202" r="9" fill="none" stroke="#7256B6" stroke-width="3"/><path d="M358 209L366 217" stroke="#7256B6" stroke-width="3" stroke-linecap="round"/>
<text x="386" y="212" class="label">品質評估</text>
<text x="340" y="260" class="body">• 相關性與正確性</text><text x="340" y="298" class="body">• 任務多樣性</text><text x="340" y="336" class="body">• 重複與冗餘程度</text>
<text x="340" y="385" class="small">依目標設計評估規則</text>
<rect x="580" y="165" width="235" height="250" rx="18" fill="#FBF0E3" stroke="#E5B27C" stroke-width="2"/>
<circle cx="619" cy="205" r="19" fill="#F6DFC4"/><path d="M608 195H630L622 205V215L616 218V205Z" fill="#C97A39"/>
<text x="651" y="212" class="label">樣本篩選</text>
<text x="605" y="260" class="body">• 保留高品質樣本</text><text x="605" y="298" class="body">• 控制任務比例</text><text x="605" y="336" class="body">• 去除冗餘樣本</text>
<text x="605" y="385" class="small">不是任意縮減資料</text>
<rect x="845" y="165" width="305" height="250" rx="18" fill="#EAF5EF" stroke="#9ACBB6" stroke-width="2"/>
<circle cx="884" cy="205" r="19" fill="#D1E9DC"/><path d="M874 211V200L884 193L894 200V211Z" fill="none" stroke="#357E70" stroke-width="2.5"/><path d="M881 211V203H887V211" fill="none" stroke="#357E70" stroke-width="2"/>
<text x="916" y="212" class="label">微調與評估</text>
<text x="870" y="260" class="body">• 依指令學習回答行為</text><text x="870" y="298" class="body">• 監測任務表現與幻覺</text><text x="870" y="336" class="body">• 與全量訓練基線比較</text>
<text x="870" y="385" class="small">以驗證集檢查取捨</text>
<path d="M285 290H310 M550 290H575 M815 290H840" stroke="#718B91" stroke-width="3" marker-end="url(#arrow)"/>
</g>
<rect x="50" y="455" width="1100" height="90" rx="16" fill="#F4F0E7" stroke="#DED5C6"/>
<text x="75" y="487" class="label">研究案例（特定實驗，不是通用規則）</text>
<text x="75" y="516" class="body">MM-LIMA：測試少量精選樣本；XMAS：在特定基準上移除部分冗餘樣本仍維持表現。</text>
</svg>